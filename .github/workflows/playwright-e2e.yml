name: Playwright E2E

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'database/seed/**'
      - '.github/workflows/playwright-e2e.yml'
  pull_request:
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'database/seed/**'
      - '.github/workflows/playwright-e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  playwright-e2e:
    name: Browser workflows against temporary PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Generate disposable test credentials
        shell: bash
        run: |
          set -euo pipefail
          for name in CI_DB_PASSWORD E2E_MANAGER_PASSWORD E2E_PICKER_PASSWORD; do
            value="$(openssl rand -hex 24)"
            echo "::add-mask::$value"
            printf '%s=%s\n' "$name" "$value" >> "$GITHUB_ENV"
          done
          echo 'E2E_MANAGER_USERNAME=ci_manager' >> "$GITHUB_ENV"
          echo 'E2E_PICKER_USERNAME=ci_picker' >> "$GITHUB_ENV"

      - name: Start disposable PostgreSQL 17
        shell: bash
        run: |
          set -euo pipefail
          docker run --detach --name picker-ci-postgres \
            --env POSTGRES_DB=warehouse_picker \
            --env POSTGRES_USER=warehouse_owner \
            --env "POSTGRES_PASSWORD=$CI_DB_PASSWORD" \
            --publish 127.0.0.1:5432:5432 \
            postgres:17

          for attempt in {1..60}; do
            if docker exec picker-ci-postgres \
              pg_isready -U warehouse_owner -d warehouse_picker >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          docker logs picker-ci-postgres
          exit 1

      - name: Build and start Spring Boot API
        shell: bash
        run: |
          set -euo pipefail
          cd backend
          chmod +x mvnw
          ./mvnw --batch-mode -DskipTests package

          export DB_URL=jdbc:postgresql://127.0.0.1:5432/warehouse_picker
          export DB_USERNAME=warehouse_owner
          export DB_PASSWORD="$CI_DB_PASSWORD"
          export FLYWAY_USERNAME=warehouse_owner
          export FLYWAY_PASSWORD="$CI_DB_PASSWORD"
          export INITIAL_MANAGER_USERNAME="$E2E_MANAGER_USERNAME"
          export INITIAL_MANAGER_PASSWORD="$E2E_MANAGER_PASSWORD"
          export INITIAL_MANAGER_FULL_NAME='CI Manager'

          java -jar target/backend-0.0.1-SNAPSHOT.jar \
            > "$RUNNER_TEMP/picker-backend.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/picker-backend.pid"

          for attempt in {1..90}; do
            if curl --silent --fail http://127.0.0.1:8080/actuator/health >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          tail -n 100 "$RUNNER_TEMP/picker-backend.log"
          exit 1

      - name: Load demonstration warehouse and picking tasks
        shell: bash
        run: |
          set -euo pipefail
          docker exec -i picker-ci-postgres \
            psql -v ON_ERROR_STOP=1 -U warehouse_owner -d warehouse_picker \
            < database/seed/01_seed_test_data.sql

      - name: Create E2E picker and assign a demo task
        shell: bash
        run: |
          set -euo pipefail
          payload="$(printf '{"username":"ci_picker","fullName":"CI Picker","password":"%s","role":"PICKER"}' "$E2E_PICKER_PASSWORD")"
          picker_json="$(curl --silent --show-error --fail-with-body \
            -u "${E2E_MANAGER_USERNAME}:${E2E_MANAGER_PASSWORD}" \
            -H 'Content-Type: application/json' \
            -X POST http://127.0.0.1:8080/api/users \
            --data "$payload")"
          picker_id="$(printf '%s' "$picker_json" | jq -er '.id')"

          tasks_json="$(curl --silent --show-error --fail-with-body \
            -u "${E2E_MANAGER_USERNAME}:${E2E_MANAGER_PASSWORD}" \
            http://127.0.0.1:8080/api/tasks)"
          task_id="$(printf '%s' "$tasks_json" | jq -er '[.[] | select(.status == "NEW")][0].id')"

          curl --silent --show-error --fail-with-body \
            -u "${E2E_MANAGER_USERNAME}:${E2E_MANAGER_PASSWORD}" \
            -H 'Content-Type: application/json' \
            -X POST "http://127.0.0.1:8080/api/tasks/${task_id}/assign" \
            --data "{\"pickerId\":${picker_id}}" > /dev/null

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E scenarios
        working-directory: frontend
        env:
          NODE_OPTIONS: --dns-result-order=ipv4first
        run: npm run test:e2e

      - name: Upload browser test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          if-no-files-found: ignore
