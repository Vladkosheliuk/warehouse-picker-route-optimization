spring:
  application:
    name: warehouse-picker-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/warehouse_picker}
    username: ${DB_USERNAME:warehouse_owner}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
